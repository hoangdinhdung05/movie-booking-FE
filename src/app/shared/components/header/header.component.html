<header class="header">
  <!-- Logo hoặc tên app -->
  <div class="logo">
    MovieBooking
  </div>

  <!-- Thanh tìm kiếm -->
  <div class="search-bar">
    <input type="text" placeholder="Search..." />
  </div>

  <!-- Khu vực nút action -->
  <div class="actions">
    <!-- Icon notification -->
    <button class="icon-btn" title="Notifications">
      <i class="fas fa-bell"></i>
    </button>

    <!-- Icon settings -->
    <button class="icon-btn" title="Settings">
      <i class="fas fa-cog"></i>
    </button>

    <!-- Thông tin user -->
    <div class="user-info">
      <img
        src="https://i.pravatar.cc/40"
        alt="avatar"
        class="avatar"
      />
      <span>John Doe</span>
    </div>
  </div>
</header>
