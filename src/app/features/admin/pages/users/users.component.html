<h2>Users</h2>
<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Username</th>
      <th>Email</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let user of users">
      <td>{{user.id}}</td>
      <td>{{user.name}}</td>
      <td>{{user.email}}</td>
      <td>{{user.status}}</td>
    </tr>
  </tbody>
</table>

<button (click)="prevPage()" [disabled]="page === 0">Previous</button>
<button (click)="nextPage()" [disabled]="page + 1 >= totalPages">Next</button>
