<div class="register-container">
  <h2>Đăng ký tài khoản</h2>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <!-- Name -->
    <div class="form-group">
      <label for="name">Họ và tên</label>
      <input id="name" type="text" formControlName="name" />
      <div class="error" *ngIf="registerForm.get('name')?.touched && registerForm.get('name')?.invalid">
        Vui lòng nhập họ và tên
      </div>
    </div>

    <!-- Username -->
    <div class="form-group">
      <label for="username">Tên đăng nhập</label>
      <input id="username" type="text" formControlName="username" />
      <div class="error" *ngIf="registerForm.get('username')?.touched && registerForm.get('username')?.hasError('required')">
        Vui lòng nhập tên đăng nhập
      </div>
      <div class="error" *ngIf="registerForm.get('username')?.touched && registerForm.get('username')?.hasError('minlength')">
        Tên đăng nhập ít nhất 6 ký tự
      </div>
    </div>

    <!-- Email -->
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" />
      <div class="error" *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.hasError('required')">
        Vui lòng nhập email
      </div>
      <div class="error" *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.hasError('email')">
        Email không hợp lệ
      </div>
    </div>

    <!-- Password -->
    <div class="form-group">
      <label for="password">Mật khẩu</label>
      <input id="password" type="password" formControlName="password" />
      <div class="error" *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.hasError('required')">
        Vui lòng nhập mật khẩu
      </div>
      <div class="error" *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.hasError('minlength')">
        Mật khẩu ít nhất 6 ký tự
      </div>
    </div>

    <!-- Server error -->
    <div class="error server-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <button type="submit" [disabled]="registerForm.invalid">Đăng ký</button>
  </form>

  <p class="login-link">
    Đã có tài khoản? <a routerLink="/auth/login">Đăng nhập</a>
  </p>
</div>
