<div class="register-container">
  <h2>Đăng nhập</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <!-- Username -->
    <div class="form-group">
      <label for="username">Tên đăng nhập</label>
      <input id="username" type="text" formControlName="username" />
      <div class="error" *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.hasError('required')">
        Vui lòng nhập tên đăng nhập
      </div>
      <div class="error" *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.hasError('minlength')">
        Tên đăng nhập ít nhất 6 ký tự
      </div>
    </div>

    <!-- Password -->
    <div class="form-group">
      <label for="password">Mật khẩu</label>
      <input id="password" type="password" formControlName="password" />
      <div class="error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')">
        Vui lòng nhập mật khẩu
      </div>
      <div class="error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('minlength')">
        Mật khẩu ít nhất 6 ký tự
      </div>
    </div>

    <!-- Server error -->
    <div class="error server-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <button type="submit">Đăng nhập</button>
  </form>

  <p class="register-link">
    Đăng kí tài khoản ? <a routerLink="/auth/register">Đăng kí</a>
  </p>
</div>
