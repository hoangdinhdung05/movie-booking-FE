<form [formGroup]="activeForm" (ngSubmit)="onSubmit()">
  <div>
    <label>Email</label>
    <input type="email" formControlName="email">
  </div>

  <div>
    <label>OTP</label>
    <input type="text" formControlName="otp" maxlength="6">
  </div>

  <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>

  <button type="submit" [disabled]="activeForm.invalid">Kích hoạt</button>
  <button type="button">Gửi lại OTP</button>
</form>
